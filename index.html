<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本地加密笔记 · 密钥轮换 Demo</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 20px; }
    fieldset { border: 1px solid #8884; border-radius: 8px; margin-bottom: 16px; }
    legend { font-weight: 600; padding: 0 6px; }
    input, button, textarea { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #8886; }
    button { cursor: pointer; background: #2563eb; color: #fff; border: none; }
    button.secondary { background: #6b7280; }
    button.danger { background: #dc2626; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
    #notes { list-style: none; padding: 0; }
    #notes li { border: 1px solid #8884; border-radius: 8px; padding: 8px 12px; margin: 6px 0; }
    #notes .meta { font-size: 12px; opacity: .65; }
    #progress-wrap { display: none; margin: 8px 0; }
    #progress-bar { height: 10px; background: #2563eb; width: 0%; border-radius: 5px; transition: width .15s; }
    #progress-track { background: #8883; border-radius: 5px; overflow: hidden; }
    #toasts { position: fixed; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 9; }
    .toast { padding: 10px 14px; border-radius: 8px; color: #fff; max-width: 340px; box-shadow: 0 2px 10px #0004; }
    .toast.error { background: #dc2626; }
    .toast.info { background: #2563eb; }
    .toast.success { background: #16a34a; }
    #status { font-size: 13px; opacity: .8; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>🔐 本地加密笔记（Web Crypto + IndexedDB + Web Worker）</h1>

  <fieldset id="auth-box">
    <legend>解锁 / 初始化</legend>
    <div class="row">
      <input id="password" type="password" placeholder="口令" autocomplete="current-password" />
      <button id="btn-unlock">解锁</button>
      <button id="btn-setup" class="secondary">首次初始化</button>
    </div>
    <div id="status">未解锁</div>
  </fieldset>

  <fieldset id="main-box" class="hidden">
    <legend>笔记</legend>
    <div class="row">
      <input id="note-input" placeholder="写点什么…" style="flex:1" />
      <button id="btn-add">加密保存</button>
      <button id="btn-gen" class="secondary">生成 1000 条测试数据</button>
    </div>
    <div class="row">
      <input id="new-password" type="password" placeholder="新口令（可选）" />
      <button id="btn-rotate" class="danger">轮换密钥</button>
      <button id="btn-crash" class="secondary">模拟崩溃（刷新）</button>
      <span id="status2"></span>
    </div>
    <div id="progress-wrap">
      <div id="progress-track"><div id="progress-bar"></div></div>
      <div id="progress-text" style="font-size:12px"></div>
    </div>
    <ul id="notes"></ul>
  </fieldset>

  <div id="toasts"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
